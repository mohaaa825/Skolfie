[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skolfie"
version = "0.1.0"
description = "Prototype AI-vs-human text detector combining stylometric features, Burrows' Delta and an ML ensemble."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "joblib>=1.3",
    "python-docx>=1.0",
    "pypdf>=3.0",
    "pyarrow>=14",
]

[project.scripts]
skolfie = "skolfie.cli:main"

[project.optional-dependencies]
app = ["gradio>=4"]
data = ["huggingface_hub>=0.20", "gdown>=5"]
generate = ["requests>=2.31"]
features = ["lightgbm>=4", "torch>=2.1", "transformers>=4.40"]
dev = ["pytest", "ruff", "lightgbm>=4"]

[tool.setuptools.packages.find]
include = ["skolfie*"]
exclude = ["tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Fixture data: one long string literal per example text.
"tests/fixtures/seed_texts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
