name: CI

on:
  push:
  pull_request:

# Read-only token: the job only checks out, lints and tests; it needs no secrets.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # skolfie.features.stylometric uses NLTK's tokenizers and POS tagger
      # (punkt, punkt_tab, averaged_perceptron_tagger, averaged_perceptron_tagger_eng).
      # Importing the module never downloads anything, so fetch the data here.
      - name: Download NLTK data
        run: python -c "from skolfie.features.stylometric import download_nltk_data; download_nltk_data()"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
